<script>

function tn(ty,f0,f1,d,v,fc,q,vib,at){const a=ctxA(),t=a.currentTime+(at||0),o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);f.type='bandpass';f.frequency.value=fc;f.Q.value=q;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);if(vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=vib;lg.gain.value=f0*.05;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+d)}o.connect(f);f.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}

 if(i===0){tn('sawtooth',450,850,.16,.6,1500,3,0,0);tn('sawtooth',850,420,.5,.6,1300,3,0,.16)}

 else if(i===2){[0,.5].forEach(d=>{vc(150,240,.2,[[500,5],[1100,7]],[[420,5],[1900,8]],.7,d,{am:.4,amf:40});vc(220,120,.18,[[420,5],[1200,7]],[[380,5],[1000,7]],.7,d+.18,{am:.6,amf:55})})}
 else if(i===3){vc(95,125,.45,[[250,5],[900,6],[2200,8]],[[500,5],[850,6]],.8,0,{att:.12,vib:4.5});vc(125,85,1.2,[[500,5],[850,6]],[[360,5],[700,6]],.8,.4,{vib:4.5,att:.05})}
